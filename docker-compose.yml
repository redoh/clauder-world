services:
  postgres:
    image: postgres:17-alpine
    container_name: claude-world-db
    restart: unless-stopped
    ports:
      - "5440:5432"
    environment:
      POSTGRES_USER: claude
      POSTGRES_PASSWORD: claude
      POSTGRES_DB: claude_world
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
